  <line x1="368" y1="376" x2="642" y2="376" stroke="#d8d2c8"/>
  <text x="368" y="402" font-size="12" fill="#6b6560">BEST FIT</text>
  <text x="368" y="422" font-size="14" fill="#1c1b19">High ceiling once parry timing lands</text>
