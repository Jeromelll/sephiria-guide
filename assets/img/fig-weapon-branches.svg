<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Alegreya Sans', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="520" fill="#faf7f2"/>
