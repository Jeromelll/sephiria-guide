name: Deploy Sephiria Guide (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level env so the step-level `if` can read it. The `secrets`
    # context is NOT available in step `if` conditionals, so we map it
    # here and gate on the `env` context instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static site
        run: python3 build.py

      - name: Deploy to Cloudflare Pages
        # Only fires once the CLOUDFLARE_API_TOKEN secret is configured in the repo.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4.129.0 pages deploy . --project-name sephiria-guide
