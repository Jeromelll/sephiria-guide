name: Deploy Sephiria Guide (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level env so the step-level `if` can read it. The `secrets`
    # context is NOT available in step `if` conditionals, so we map it
    # here and gate on the `env` context instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py 用 git log 取 sitemap lastmod / dateModified

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax, build, and tests
        run: bash tools/ci_sephiria.sh

      - name: Deploy to Cloudflare Pages
        # Production only, and only after the local checks above. A pull request
        # never triggers this workflow. Manual dispatch from another branch does not deploy.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: npx wrangler@4.129.0 pages deploy dist --project-name sephiria-guide

      - name: Probe production after deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        timeout-minutes: 10
        run: python3 tools/probe_live.py --site sephiria
