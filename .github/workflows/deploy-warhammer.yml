name: Deploy Warhammer Survivors (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'extra_sites/warhammer-survivors/**'
      - 'tools/build_standalone_wh.py'
      - '.github/workflows/deploy-warhammer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build standalone site
        run: python3 tools/build_standalone_wh.py

      - name: Verify no sub-site leftovers
        run: python3 tools/build_standalone_wh.py --check

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4.129.0 pages project create warhammer-survivors --production-branch=main 2>&1 | tee /tmp/create.log || true
          grep -qiE "already exists|already taken" /tmp/create.log && echo "project exists, continuing"
          npx wrangler@4.129.0 pages deploy warhammer-dist --project-name warhammer-survivors --commit-dirty=true

      - name: Bind custom domain
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          for d in warhammersurvivors.com www.warhammersurvivors.com; do
            echo "binding $d"
            curl -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$d\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/warhammer-survivors/domains" \
              | head -c 400; echo
          done
