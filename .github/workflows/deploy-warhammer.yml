name: Deploy Warhammer Survivors (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'extra_sites/warhammer-survivors/**'
      - 'extra_sites/_root_files/**'
      - 'tools/build_standalone_wh.py'
      - '.github/workflows/deploy-warhammer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax, build, and tests
        run: bash tools/ci_warhammer.sh

      - name: Deploy to Cloudflare Pages
        # Production only, and only after the local checks above.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: |
          npx wrangler@4.129.0 pages project create warhammer-survivors --production-branch=main 2>&1 | tee /tmp/create.log || true
          grep -qiE "already exists|already taken" /tmp/create.log && echo "project exists, continuing"
          npx wrangler@4.129.0 pages deploy warhammer-dist --project-name warhammer-survivors --commit-dirty=true

      - name: Probe production after deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        timeout-minutes: 10
        run: python3 tools/probe_live.py --site warhammer

      - name: Bind custom domain
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: |
          for d in warhammersurvivors.com www.warhammersurvivors.com; do
            echo "=== binding $d ==="
            curl -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$d\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/warhammer-survivors/domains"
            echo
          done
          echo "=== current domains ==="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/warhammer-survivors/domains"
          echo
